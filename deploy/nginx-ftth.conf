# Alternative to Caddy when the server already runs nginx.
# 1. Copy to /etc/nginx/sites-available/ftth and replace planner.example.com
# 2. sudo ln -s /etc/nginx/sites-available/ftth /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. sudo certbot --nginx -d planner.example.com      (adds HTTPS - required: the app redirects plain HTTP
#    to HTTPS, so without certbot's 443 server block the site would redirect in a loop)
server {
    listen 80;
    server_name planner.example.com;
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
